<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1428"><title>যোদ্ধা | YODDHA</title>
<style>
:root{--bg:#0b1428;--panel:#172642;--panel2:#203452;--line:#304767;--gold:#e4b84e;--txt:#f4f6fb;--muted:#aab7ca;--red:#ff7777;--green:#6cdaa0}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#0b1428,#101d35);color:var(--txt);font:15px system-ui,-apple-system,"Noto Sans Bengali",sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:#243958;color:white;border-radius:12px;padding:11px 14px;font-weight:650}button.primary{background:linear-gradient(135deg,#f0ca68,#c99731);color:#17213a;border:0}button.danger{background:#542d3a;border-color:#814657}button.ghost{background:transparent}.wrap{max-width:1100px;margin:auto;padding:18px}.brand{text-align:center;padding:24px 10px 18px}.logo{width:66px;height:66px;margin:auto;border-radius:20px;background:linear-gradient(145deg,#f4d47c,#c9952f);display:grid;place-items:center;color:#14213b;font-size:38px;font-weight:900}.brand h1{font-size:34px;margin:10px 0 0}.brand p{margin:3px;color:var(--muted);letter-spacing:1px}.card{background:rgba(25,42,69,.96);border:1px solid var(--line);border-radius:20px;padding:18px;margin:14px 0;box-shadow:0 12px 30px #0002}.hidden{display:none!important}.muted{color:var(--muted)}.small{font-size:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.stat{background:#203451;border:1px solid #304767;border-radius:15px;padding:14px}.stat b{display:block;font-size:23px;color:var(--gold);margin-top:5px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}h2{font-size:22px;margin:4px 0 14px}h3{margin:4px 0 10px}.nav{display:flex;gap:8px;overflow:auto;padding:8px 0 12px;position:sticky;top:0;background:#0b1428f2;z-index:3}.nav button{white-space:nowrap}.nav button.active{background:var(--gold);color:#18233a;border-color:var(--gold)}label{display:block;color:var(--muted);font-size:13px;margin:10px 0 5px}input,select{width:100%;background:#0f1d34;border:1px solid var(--line);color:white;border-radius:11px;padding:12px;outline:none}input:focus,select:focus{border-color:var(--gold)}.field{min-width:140px;flex:1}form .row>*{flex:1}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:540px}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}th{color:var(--gold)}.notice{background:#223754;border-radius:13px;padding:13px;color:#d9e3f3;line-height:1.6}.success{color:var(--green)}.error{color:var(--red)}.pill{border-radius:30px;padding:4px 9px;background:#304665;font-size:12px}.right{text-align:right}.empty{padding:22px;text-align:center;color:var(--muted)}.footer{text-align:center;color:var(--muted);padding:22px}.actions{display:flex;gap:6px;flex-wrap:wrap}.actions button{padding:7px 10px;font-size:12px}.total{font-weight:800;color:var(--gold)}@media(min-width:760px){.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.brand{padding-top:35px}}@media print{body{background:white;color:#111}.nav,.no-print,button{display:none!important}.card{background:white;color:#111;border:1px solid #aaa;box-shadow:none}.muted{color:#444}th{color:#111}td,th{border-color:#aaa}}
</style>
</head>
<body>
<div class="wrap">
<header class="brand"><div class="logo">য</div><h1>যোদ্ধা</h1><p>YODDHA MANAGEMENT</p></header>

<section id="loginView" class="card" style="max-width:520px;margin:20px auto">
<h2>Login to YODDHA</h2>
<div class="notice small">আপনার Firebase-এ তৈরি করা Email ও Password ব্যবহার করে প্রবেশ করুন।</div>
<form id="loginForm">
<label>Email</label><input id="loginEmail" type="email" autocomplete="username" required>
<label>Password</label><input id="loginPassword" type="password" autocomplete="current-password" required>
<div class="row" style="margin-top:15px"><button class="primary" type="submit">Login</button><span id="loginMsg" class="muted small"></span></div>
</form></section>

<main id="appView" class="hidden">
<div class="between card"><div><div class="muted small" id="roleLabel">Account</div><h2 id="hello" style="margin:3px 0">Hello!</h2></div><div class="actions"><button class="ghost" id="refreshBtn">Refresh</button><button id="logoutBtn">Logout</button></div></div>
<nav id="nav" class="nav no-print"></nav>
<section id="page"></section>
</main>
<div class="footer">যোদ্ধা • YODDHA Management</div>
</div>
<script type="module">
import {initializeApp, getApps} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,doc,getDoc,collection,getDocs,addDoc,setDoc,updateDoc,deleteDoc,query,where,orderBy} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyAIg-ITyRLIhd04E19mogQU_ajbLEwAHdg",authDomain:"yoddha-65d05.firebaseapp.com",projectId:"yoddha-65d05",storageBucket:"yoddha-65d05.firebasestorage.app",messagingSenderId:"748214289264",appId:"1:748214289264:web:64482bc446f356ca65c5b5"};
const app=getApps().length?getApps()[0]:initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const $=id=>document.getElementById(id), money=n=>"৳"+(Number(n)||0).toLocaleString("en-US"), num=n=>Number(n)||0, esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])), today=()=>new Date().toISOString().slice(0,10), month=()=>today().slice(0,7);
let me=null,profile=null,users=[],parcels=[],advances=[],active="home";
const adminTabs=[["home","Dashboard"],["riders","Rider Management"],["parcels","Parcel Management"],["salary","Salary & Commission"],["advance","Advance Salary"],["ranking","Rider Ranking"],["reports","Reports"],["profile","Admin Profile"]];
const riderTabs=[["home","Home"],["myparcels","My Parcels"],["mysalary","My Salary"],["profile","My Profile"]];
function showMsg(id,msg,ok=false){$(id).textContent=msg;$(id).className=ok?"success small":"error small"}
function dateMonth(d){return String(d||"").slice(0,7)}
function personName(u){return u.Name||u.name||u.UserID||"Rider"}
function riderRows(){return users.filter(u=>String(u.Role||"").toLowerCase()==="rider"&&(u.Status||"Active")==="Active")}
function myUid(){return me?.uid}
async function loadData(){
 if(String(profile.Role).toLowerCase()==="admin"){
  const [us,ps,as]=await Promise.all([getDocs(collection(db,"Users")),getDocs(collection(db,"Parcels")),getDocs(collection(db,"Advances"))]);
  users=us.docs.map(x=>({uid:x.id,...x.data()}));parcels=ps.docs.map(x=>({id:x.id,...x.data()}));advances=as.docs.map(x=>({id:x.id,...x.data()}));
 }else{
  const [ps,as]=await Promise.all([
   getDocs(query(collection(db,"Parcels"),where("UserUID","==",myUid()))),
   getDocs(query(collection(db,"Advances"),where("UserUID","==",myUid())))
  ]);
  users=[profile];parcels=ps.docs.map(x=>({id:x.id,...x.data()}));advances=as.docs.map(x=>({id:x.id,...x.data()}));
 }
}
function mineParcels(){return parcels.filter(p=>p.UserUID===myUid())}
function mineAdvances(){return advances.filter(a=>a.UserUID===myUid())}
function selectedParcels(uid){return parcels.filter(p=>p.UserUID===uid&&dateMonth(p.Date)===month())}
function selectedAdvances(uid){return advances.filter(a=>a.UserUID===uid&&dateMonth(a.Date)===month())}
function salary(uid){
 const u=users.find(x=>x.uid===uid)||profile||{}, ps=parcels.filter(p=>p.UserUID===uid&&dateMonth(p.Date)===month()), adv=selectedAdvances(uid).reduce((s,a)=>s+num(a.Amount),0);
 const delivered=ps.reduce((s,p)=>s+num(p.Delivered),0),received=ps.reduce((s,p)=>s+num(p.Received),0),ret=ps.reduce((s,p)=>s+num(p.Return),0),duty=ps.filter(p=>num(p.Delivered)>0).length;
 const bike=String(u.RiderType||"Bike").toLowerCase()==="bike",rate=bike?(delivered<=550?15:delivered<=700?17:21):(delivered<=450?15:delivered<=650?17:21);
 const basic=num(u.BasicSalary??8000),mobile=num(u.MobileBill??500),fuel=bike?duty*100:0,commission=delivered*rate,total=basic+mobile+fuel+commission;
 return {received,delivered,ret,pending:Math.max(0,received-delivered-ret),duty,rate,basic,mobile,fuel,commission,advance:adv,total,net:total-adv,success:received?(delivered+ret)/received*100:0};
}
function navRender(){const tabs=String(profile.Role).toLowerCase()==="admin"?adminTabs:riderTabs;$("nav").innerHTML=tabs.map(([k,v])=>`<button data-tab="${k}" class="${active===k?"active":""}">${v}</button>`).join("");$("nav").querySelectorAll("button").forEach(b=>b.onclick=()=>{active=b.dataset.tab;render()})}
function stats(items){return `<div class="grid">${items.map(([l,v])=>`<div class="stat"><span class="muted small">${l}</span><b>${v}</b></div>`).join("")}</div>`}
function table(headers,rows){return `<div class="tablewrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.length?rows.join(""):`<tr><td colspan="${headers.length}" class="empty">কোনো তথ্য নেই</td></tr>`}</tbody></table></div>`}
function parcelTable(ps,admin=false){return table(["Date","Received","Delivered","Pending","Return",...(admin?["Rider","Action"]:[])],ps.sort((a,b)=>(b.Date||"").localeCompare(a.Date||"")).map(p=>`<tr><td>${esc(p.Date)}</td><td>${num(p.Received)}</td><td>${num(p.Delivered)}</td><td>${Math.max(0,num(p.Received)-num(p.Delivered)-num(p.Return))}</td><td>${num(p.Return)}</td>${admin?`<td>${esc(users.find(u=>u.uid===p.UserUID)?.Name||p.UserUID)}</td><td><button data-delparcel="${p.id}" class="danger">Delete</button></td>`:""}</tr>`))}
function homePage(){
 const admin=String(profile.Role).toLowerCase()==="admin";
 if(admin){const r=riderRows(),p=parcels.filter(x=>dateMonth(x.Date)===month()),del=p.reduce((s,x)=>s+num(x.Delivered),0),rec=p.reduce((s,x)=>s+num(x.Received),0);
 return `<div class="card"><h2>Monthly Overview • ${month()}</h2>${stats([["Active Riders",r.length],["Total Parcels",rec],["Delivered",del],["Pending",p.reduce((s,x)=>s+Math.max(0,num(x.Received)-num(x.Delivered)-num(x.Return)),0)],["Commission",money(r.reduce((s,u)=>s+salary(u.uid).commission,0))]])}</div><div class="card"><h3>Recent Parcel Entries</h3>${parcelTable(p.slice(0,12),true)}</div>`}
 const s=salary(myUid()),ps=mineParcels().filter(p=>dateMonth(p.Date)===month());
 return `<div class="card"><h2>This Month • ${month()}</h2>${stats([["Received",s.received],["Delivered",s.delivered],["Pending",s.pending],["Return",s.ret],["Success Rate",s.success.toFixed(1)+"%"],["Net Salary",money(s.net)]])}</div><div class="card"><h3>My Recent Parcels</h3>${parcelTable(ps)}</div>`;
}
function riderPage(){return `<div class="card"><h2>Add New Rider</h2><form id="riderForm"><div class="row"><div class="field"><label>Rider Name</label><input id="rName" required></div><div class="field"><label>User ID</label><input id="rUserID" required></div></div><div class="row"><div class="field"><label>Email (Login)</label><input id="rEmail" type="email" required></div><div class="field"><label>Password</label><input id="rPassword" type="password" minlength="6" required></div></div><div class="row"><div class="field"><label>Mobile Number</label><input id="rMobile"></div><div class="field"><label>Rider Type</label><select id="rType"><option>Bike</option><option>Cycle</option></select></div></div><button class="primary">Create Rider Account</button><span id="riderMsg" class="small"></span></form></div><div class="card"><div class="between"><h2>Rider List</h2><span class="pill">${riderRows().length} Active Riders</span></div>${table(["Name","User ID","Type","Status","Basic Salary","Mobile Bill"],users.filter(u=>String(u.Role).toLowerCase()==="rider").map(u=>`<tr><td>${esc(personName(u))}</td><td>${esc(u.UserID)}</td><td>${esc(u.RiderType||"-")}</td><td><span class="pill">${esc(u.Status||"Active")}</span></td><td>${money(u.BasicSalary??8000)}</td><td>${money(u.MobileBill??500)}</td></tr>`))}</div>`}
function parcelPage(admin=false){const list=admin?parcels:mineParcels();const options=admin?`<label>Rider</label><select id="parcelRider">${riderRows().map(u=>`<option value="${u.uid}">${esc(personName(u))}</option>`).join("")}</select>`:"";
 return `<div class="card"><h2>${admin?"Parcel Management":"Add Parcel Entry"}</h2><form id="parcelForm">${options}<div class="row"><div class="field"><label>Date</label><input type="date" id="pDate" value="${today()}" required></div><div class="field"><label>Received</label><input type="number" min="0" id="pReceived" required></div></div><div class="row"><div class="field"><label>Delivered</label><input type="number" min="0" id="pDelivered" required></div><div class="field"><label>Return</label><input type="number" min="0" id="pReturn" value="0" required></div></div><button class="primary" type="submit">Save Parcel</button><span id="parcelMsg" class="small"></span></form></div><div class="card"><h3>${admin?"All Parcel Entries":"My Parcel History"}</h3>${parcelTable(list,admin)}</div>`}
function salaryPage(admin=false){const targets=admin?riderRows():[profile];return targets.map(u=>{const s=salary(u.uid);return `<div class="card"><div class="between"><h2>${esc(personName(u))}</h2><button onclick="window.print()" class="no-print">Print Slip</button></div><p class="muted">${month()} • ${esc(u.RiderType||"Bike")} Rider</p>${stats([["Delivered",s.delivered],["Duty Days",s.duty],["Commission Rate",money(s.rate)],["Commission",money(s.commission)]])}${table(["Salary Details","Amount"],[["Basic Salary",money(s.basic)],["Parcel Commission",money(s.commission)],["Mobile Bill",money(s.mobile)],["Fuel Allowance",money(s.fuel)],["Total Earnings",money(s.total)],["Advance Salary","− "+money(s.advance)],["Net Payable Salary",money(s.net)]].map(([a,b])=>`<tr><td>${a}</td><td class="total">${b}</td></tr>`))}${!admin?`<h3>Daily Parcel Summary</h3>${parcelTable(mineParcels().filter(p=>dateMonth(p.Date)===month()))}`:""}</div>`}).join("")}
function advancePage(){return `<div class="card"><h2>Advance Salary</h2><form id="advanceForm"><label>Date</label><input type="date" id="aDate" value="${today()}" required><label>Amount (৳)</label><input type="number" id="aAmount" min="1" required><label>Note</label><input id="aNote" placeholder="Optional"><button class="primary" style="margin-top:12px">Save Advance</button><span id="advanceMsg" class="small"></span></form></div><div class="card"><h3>Advance History</h3>${table(["Date","Amount","Note"],mineAdvances().map(a=>`<tr><td>${esc(a.Date)}</td><td>${money(a.Amount)}</td><td>${esc(a.Note||"-")}</td></tr>`))}</div>`}
function rankingPage(){const rows=riderRows().map(u=>({u,s:salary(u.uid)})).sort((a,b)=>b.s.delivered-a.s.delivered);return `<div class="card"><h2>Monthly Rider Ranking</h2>${table(["Rank","Rider","Delivered"],rows.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(personName(x.u))}</td><td>${x.s.delivered}</td></tr>`))}</div>`}
function reportsPage(){return `<div class="card"><h2>Reports</h2><p class="muted">বর্তমান মাসের সারাংশ প্রিন্ট বা PDF হিসেবে সংরক্ষণ করতে Print চাপুন।</p>${stats([["Riders",riderRows().length],["Parcel Entries",parcels.filter(p=>dateMonth(p.Date)===month()).length],["Delivered",parcels.filter(p=>dateMonth(p.Date)===month()).reduce((s,p)=>s+num(p.Delivered),0)]])}<button class="primary no-print" onclick="window.print()">Print / Save PDF</button></div>`}
function profilePage(){return `<div class="card"><h2>My Profile</h2>${table(["Field","Value"],[["Name",esc(personName(profile))],["User ID",esc(profile.UserID||"-")],["Role",esc(profile.Role)],["Rider Type",esc(profile.RiderType||"-")],["Status",esc(profile.Status||"Active")],["Email",esc(me.email||"-")]])}</div>`}
function render(){navRender();const admin=String(profile.Role).toLowerCase()==="admin";$("page").innerHTML=active==="home"?homePage():active==="riders"&&admin?riderPage():active==="parcels"?parcelPage(admin):active==="salary"?salaryPage(admin):active==="advance"?advancePage():active==="ranking"&&admin?rankingPage():active==="reports"&&admin?reportsPage():active==="myparcels"?parcelPage(false):active==="mysalary"?salaryPage(false):profilePage();wire()}
function wire(){
 const rf=$("riderForm");if(rf)rf.onsubmit=async e=>{e.preventDefault();const msg=$("riderMsg");msg.textContent="Creating…";try{
  const secondaryApp=initializeApp(firebaseConfig,"rider-create-"+Date.now()),secondaryAuth=getAuth(secondaryApp);
  const cred=await createUserWithEmailAndPassword(secondaryAuth,$("rEmail").value.trim(),$("rPassword").value);
  const riderData={UserID:$("rUserID").value.trim(),Name:$("rName").value.trim(),Mobile:$("rMobile").value.trim(),Role:"Rider",Status:"Active",RiderType:$("rType").value,BasicSalary:8000,MobileBill:500};
  await setDoc(doc(db,"Users",cred.user.uid),riderData);await signOut(secondaryAuth);
  msg.textContent="Rider account created successfully";msg.className="success small";await loadData();render();
 }catch(err){msg.textContent=err.message;msg.className="error small"}};
 const pf=$("parcelForm");if(pf)pf.onsubmit=async e=>{e.preventDefault();const uid=String(profile.Role).toLowerCase()==="admin"?$("parcelRider").value:myUid(),d=$("pDate").value,r=num($("pReceived").value),dl=num($("pDelivered").value),ret=num($("pReturn").value);if(dl+ret>r){showMsg("parcelMsg","Delivered + Return, Received-এর বেশি হতে পারবে না");return}try{const existing=parcels.find(p=>p.UserUID===uid&&p.Date===d);const data={UserUID:uid,Date:d,Received:r,Delivered:dl,Return:ret,UpdatedAt:new Date().toISOString()};if(existing)await updateDoc(doc(db,"Parcels",existing.id),data);else await addDoc(collection(db,"Parcels"),{...data,CreatedAt:new Date().toISOString()});await loadData();showMsg("parcelMsg","Saved successfully",true);render()}catch(err){showMsg("parcelMsg",err.message)}};
 const af=$("advanceForm");if(af)af.onsubmit=async e=>{e.preventDefault();try{await addDoc(collection(db,"Advances"),{UserUID:myUid(),Date:$("aDate").value,Amount:num($("aAmount").value),Note:$("aNote").value,CreatedAt:new Date().toISOString()});await loadData();render()}catch(err){showMsg("advanceMsg",err.message)}};
 document.querySelectorAll("[data-delparcel]").forEach(b=>b.onclick=async()=>{if(confirm("এই parcel entry মুছে ফেলবেন?")){try{await deleteDoc(doc(db,"Parcels",b.dataset.delparcel));await loadData();render()}catch(e){alert(e.message)}}});
}
$("loginForm").onsubmit=async e=>{e.preventDefault();showMsg("loginMsg","Logging in…",true);try{await signInWithEmailAndPassword(auth,$("loginEmail").value.trim(),$("loginPassword").value); }catch(err){showMsg("loginMsg",err.message)}};
$("logoutBtn").onclick=()=>signOut(auth);$("refreshBtn").onclick=async()=>{try{await loadData();render()}catch(e){alert(e.message)}};
onAuthStateChanged(auth,async user=>{me=user;if(!user){profile=null;$("appView").classList.add("hidden");$("loginView").classList.remove("hidden");return}
 try{const snap=await getDoc(doc(db,"Users",user.uid));if(!snap.exists())throw new Error("Users collection-এ এই account-এর profile পাওয়া যায়নি।");profile={uid:user.uid,...snap.data()};if(profile.Status!=="Active")throw new Error("আপনার account Inactive। Admin-এর সঙ্গে যোগাযোগ করুন।");if(!["Admin","Rider"].includes(profile.Role))throw new Error("Invalid account role.");await loadData();$("loginView").classList.add("hidden");$("appView").classList.remove("hidden");$("roleLabel").textContent=profile.Role+" account";$("hello").textContent="Hello, "+personName(profile)+"!";active="home";render()}catch(err){alert(err.message);await signOut(auth)}});
</script>
</body></html>
